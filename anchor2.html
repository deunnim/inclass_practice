<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Little Green · English Playground</title>
<style>
:root{
 --bg:#f6f8f4;--ink:#34483e;--muted:#6b7d72;--green:#397c60;
 --mint:#e0f1e5;--pink:#fae5e9;--yellow:#fbf0cc;--blue:#e4edf9;
 --line:#d5e3d8;
}
*{box-sizing:border-box}
body{
 margin:0;background:radial-gradient(ellipse at 10% 0%,#edf6e9,transparent 50%),var(--bg);
 color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;line-height:1.7
}
button,input{font:inherit}
button{
 cursor:pointer;touch-action:manipulation;color:var(--ink);
 border:1px solid var(--line);border-radius:16px;background:#fff;
 padding:11px 17px;font-weight:750;box-shadow:0 4px 0 #d5e2d7;
 transition:transform .15s,background .15s
}
button:hover:not(:disabled){transform:translateY(-2px);background:#f0f7ee}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #d5e2d7}
button:disabled{cursor:default;opacity:.5}
button:focus-visible,input:focus-visible,summary:focus-visible{
 outline:3px solid #5a9b7d;outline-offset:4px
}
.primary{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 4px 0 #285a44}
.primary:hover:not(:disabled){background:#306e54}
.soft-yellow{background:var(--yellow)}
.wrap{max-width:1060px;margin:auto;padding:25px 23px 55px}
header{display:flex;justify-content:space-between;align-items:center;gap:15px}
.brand{font-size:24px;font-weight:850;letter-spacing:-1px}
.brand small{display:block;font-size:11px;letter-spacing:1px;font-weight:650;color:var(--muted)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:25px;margin:30px 0}
h1{font-size:clamp(33px,5vw,53px);line-height:1.23;letter-spacing:-2px;margin:12px 0 20px}
h1 span{color:var(--green)}
h2{font-size:27px;line-height:1.4;margin:8px 0 12px;letter-spacing:-.8px}
h3{font-size:19px;margin:22px 0 12px}
p{margin:8px 0 16px}
.muted,.hint{color:var(--muted)}
.hint{font-size:13px}
.pill{display:inline-block;padding:5px 12px;border-radius:30px;background:var(--mint);color:#3b6d51;font-size:12px;font-weight:800}
.hero-art{display:grid;place-items:center;min-height:225px;position:relative}
.hero-art:before{content:"";position:absolute;width:270px;height:190px;border-radius:50%;background:#e4eedc}
.mascot{width:205px;height:205px;position:relative;filter:drop-shadow(0 10px 5px #496b4212)}
svg{display:block;width:100%;height:100%}
.bubble{position:absolute;top:3px;right:8px;background:#fff;border:1px solid var(--line);border-radius:20px 20px 20px 5px;padding:10px 15px;font-size:13px;box-shadow:0 5px 12px #314f3410}
.progress-row{display:flex;gap:14px;align-items:center;margin:24px 0}
.progress{height:12px;border-radius:20px;background:#e1e9df;flex:1;overflow:hidden;box-shadow:inset 0 2px 3px #465d4610}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#91b994,#6da486);border-radius:20px;transition:width .3s}
#progressText{font-size:12px;font-weight:750;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0 27px}
.tabs button{font-size:13px;padding:12px 5px}
.tabs button.active{background:#dceee1;border-color:#a4c8ad;color:#2d644b;box-shadow:0 4px 0 #b3cfb9}
.panel{background:#fffefa;border:1px solid #e2e8dc;border-radius:29px;padding:30px;box-shadow:0 9px 0 #dce6dc,0 16px 25px #405b4510}
.eyebrow{font-size:11px;font-weight:850;letter-spacing:1.6px;color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:24px}
.card{border:1px solid #e1e7db;border-radius:22px;padding:22px;background:#fff;box-shadow:0 6px 0 #e6ebdf;position:relative}
.card:nth-child(3n+1){background:#f0f6eb}
.card:nth-child(3n+2){background:#fdf0f1}
.card:nth-child(3n){background:#eff4fc}
.card.done:after{content:"✓ 수집";position:absolute;top:14px;right:14px;color:#467953;background:#dfefdf;border-radius:20px;padding:2px 8px;font-size:11px;font-weight:800}
.num{font-size:11px;font-weight:800;color:var(--muted)}
.expr{font-size:23px;font-weight:850;letter-spacing:-.7px;margin:11px 0}
.card button{font-size:12px;padding:8px 11px;margin:5px 4px 3px 0}
.card-icon{width:45px;height:45px;color:#62876a;margin-top:14px}
details{margin-top:16px}
summary{cursor:pointer;font-size:14px;font-weight:750}
.meaning{color:var(--green);font-weight:850}
.actions{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:13px;margin-top:27px}
.button-row{display:flex;gap:12px;flex-wrap:wrap}
.info{background:#edf4e8;border:1px solid #d6e5cd;border-radius:18px;padding:18px 20px;margin-top:23px}
.paper{background:white;border:1px solid #dfe8dc;border-radius:22px;padding:26px;box-shadow:0 6px 0 #e5ebdf;margin-top:22px;line-height:2.15;font-size:18px}
.word{display:inline;padding:0 3px;border:0;border-bottom:2px solid #8bb69a;border-radius:4px;background:#e8f3e8;color:#346b4b;box-shadow:none;font-size:inherit;line-height:inherit}
.word:hover:not(:disabled){transform:none;background:#d6ead8}
.question{font-size:22px;font-weight:750;line-height:1.65;margin:23px 0 12px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:24px 0}
.option{min-height:65px;text-align:left;padding:17px 20px}
.option.correct{background:#dfefdf;border-color:#70a77d;opacity:1}
.option.wrong{background:#fae3e8;border-color:#d69ca9;opacity:1}
.feedback{background:#eaf5e8;border:1px solid #add1ad;border-radius:19px;padding:19px;margin-top:23px}
.feedback.bad{background:#fff0f2;border-color:#e6b6bf}
.feedback strong{display:block;font-size:17px}
.feedback p{margin:6px 0}
input{width:100%;font-size:19px;background:#fff;border:1px solid #cbdcc9;border-radius:16px;padding:16px 18px;color:var(--ink);box-shadow:inset 0 3px 5px #48644708}
.bank{display:flex;gap:9px;flex-wrap:wrap;margin:19px 0}
.bank span{border:1px solid #d7e3d2;background:white;border-radius:11px;padding:6px 11px;font-size:13px}
.game-top{display:flex;gap:10px;flex-wrap:wrap;margin:23px 0}
.badge{border-radius:30px;background:var(--yellow);padding:7px 14px;font-size:13px;font-weight:800}
.mission{display:grid;grid-template-columns:115px 1fr;align-items:center;gap:22px;background:#f0f5e9;border:1px solid #dce6d3;border-radius:23px;padding:23px}
.art{width:91px;height:91px;border-radius:25px;background:#fdf3d6;box-shadow:0 7px 0 #eadfbe,0 11px 14px #5f63340d;padding:23px;transform:rotate(-5deg);color:#70855c}
.mission-title{font-size:20px;font-weight:850}
.slot{display:flex;align-items:center;flex-wrap:wrap;gap:11px;min-height:90px;background:#f4f7f0;border:2px dashed #bed2b8;border-radius:20px;padding:17px;margin-top:23px}
.placeholder{color:#778774;font-size:14px}
.pool{display:flex;flex-wrap:wrap;gap:13px;margin:24px 0}
.token{background:#fff3d8;padding:11px 16px;font-size:16px;border-color:#e8dab9;box-shadow:0 4px 0 #e8dcbc}
.slot .token{background:#e3eedf;border-color:#bcd2b3;box-shadow:0 4px 0 #c4d7bd}
.token:disabled{opacity:.3}
.metric{font-size:35px;font-weight:850;color:var(--green);line-height:1.3;margin:10px 0}
.reward{display:flex;align-items:center;gap:20px;background:#fbf2da;border-radius:23px;padding:23px;margin:23px 0}
.reward-icon{width:55px;height:55px;color:#a38b4e;flex-shrink:0}
.review-row{padding:17px 0;border-bottom:1px dashed #d9e4d3}
.review-row strong{color:var(--green)}
.saved-sentence{background:#fff;border:1px solid #dce7d7;border-radius:16px;padding:15px;margin:10px 0}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
.hidden{display:none!important}
#effects{position:fixed;inset:0;z-index:100;pointer-events:none;overflow:hidden}
.confetti-piece{position:absolute;left:50%;top:37%;width:9px;height:14px;border-radius:3px;animation:confetti 1.7s ease-out forwards}
@keyframes confetti{
 from{transform:translate(0,0) rotate(0);opacity:1}
 to{transform:translate(var(--dx),var(--dy)) rotate(var(--spin));opacity:0}
}
#toast{position:fixed;left:50%;top:22px;transform:translateX(-50%);z-index:110;max-width:90%;background:#fff;border:1px solid #cee0c9;border-radius:20px;padding:13px 24px;box-shadow:0 8px 25px #31493420;text-align:center;font-weight:800}
.shake{animation:shake .3s}
.pop{animation:pop .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
dialog{max-width:420px;width:calc(100% - 36px);border:1px solid var(--line);border-radius:24px;padding:26px;color:var(--ink);background:#fffefa}
dialog::backdrop{background:#263a3055}
@media(max-width:740px){
 .wrap{padding:20px 16px 42px}
 .hero{grid-template-columns:1fr;gap:0;margin:28px 0 14px}
 .hero-art{min-height:190px;max-width:330px;width:100%;margin:auto}
 .mascot{width:175px;height:175px}
 .hero-art:before{width:235px;height:155px}
 .bubble{top:0;right:0}
 .grid{grid-template-columns:1fr 1fr}
 .panel{padding:23px 18px;border-radius:24px}
 .tabs{gap:7px}
 .tabs button{font-size:11px;padding:11px 3px;border-radius:13px}
 .options{grid-template-columns:1fr}
 .mission{grid-template-columns:75px 1fr;padding:18px;gap:17px}
 .art{width:68px;height:68px;padding:16px;border-radius:20px}
 .mission-title{font-size:18px}
 .paper{font-size:16px;padding:20px}
 .question{font-size:20px}
}
@media(max-width:440px){
 .grid{grid-template-columns:1fr}
 .mission{grid-template-columns:1fr}
 .art{margin:auto}
 .token{font-size:14px;padding:10px 12px}
 .brand{font-size:21px}
 #soundButton{font-size:11px;padding:9px 11px}
}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <div class="brand">Little Green<small>ENGLISH PLAYGROUND</small></div>
  <button id="soundButton" aria-pressed="false">효과음 OFF</button>
 </header>

 <section class="hero">
  <div>
   <span class="pill">우리 학교를 위한 작은 영어 프로젝트</span>
   <h1>영어 한 조각,<br><span>초록빛 변화.</span></h1>
   <p class="muted">여섯 가지 표현을 배우고 문장을 조립하며<br>우리 반 재활용 프로젝트를 완성해 보세요.</p>
  </div>
  <div class="hero-art">
   <div class="mascot" aria-hidden="true">
    <svg viewBox="0 0 220 220">
     <ellipse cx="111" cy="199" rx="63" ry="10" fill="#c8dac1"/>
     <path d="M105 58C73 52 72 22 75 17c27 2 42 18 35 40" fill="#9ec797"/>
     <path d="M110 58c0-25 19-38 39-35 0 25-15 41-39 35" fill="#73a87f"/>
     <path d="M59 88c5-27 96-27 103 0l10 69c5 31-18 43-61 43s-68-12-62-43z" fill="#b4d7aa"/>
     <path d="M66 95c2-15 21-24 42-25" fill="none" stroke="#d8edcd" stroke-width="9" stroke-linecap="round"/>
     <ellipse cx="87" cy="126" rx="4" ry="6" fill="#3f6148"/>
     <ellipse cx="137" cy="126" rx="4" ry="6" fill="#3f6148"/>
     <path d="M103 137q9 10 18 0" fill="none" stroke="#3f6148" stroke-width="4" stroke-linecap="round"/>
     <ellipse cx="74" cy="137" rx="10" ry="6" fill="#efc2bb"/>
     <ellipse cx="150" cy="137" rx="10" ry="6" fill="#efc2bb"/>
     <path d="M51 134q-23-12-25 5M170 133q20-21 26-7" fill="none" stroke="#a3c99a" stroke-width="13" stroke-linecap="round"/>
     <path d="M83 194v9M140 194v9" stroke="#7fa778" stroke-width="14" stroke-linecap="round"/>
    </svg>
   </div>
   <div class="bubble">같이 만들어 볼까?</div>
  </div>
 </section>

 <div class="progress-row">
  <div class="progress" id="progress" role="progressbar"
   aria-label="전체 학습 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
   <i id="progressFill"></i>
  </div>
  <span id="progressText">진행 0%</span>
 </div>

 <nav class="tabs" aria-label="학습 단계">
  <button data-tab="learn">표현 카드</button>
  <button data-tab="read">스토리 읽기</button>
  <button data-tab="quiz">표현 챌린지</button>
  <button data-tab="game">미션 게임</button>
  <button data-tab="review">내 컬렉션</button>
 </nav>

 <main id="learningMain" class="panel">
  <p>학습 공간을 준비하고 있어요.</p>
 </main>
 <footer id="storageNote">학습 기록은 현재 브라우저에 자동 저장됩니다.</footer>
</div>

<div id="effects" aria-hidden="true"></div>
<div id="toast" class="hidden" role="status" aria-live="polite"></div>

<dialog id="resetDialog" aria-labelledby="resetTitle">
 <h2 id="resetTitle">처음부터 시작할까요?</h2>
 <p>저장된 진도, 답안, 게임 점수가 삭제됩니다.</p>
 <div class="actions">
  <button id="cancelReset">취소</button>
  <button class="primary" id="confirmReset">초기화</button>
 </div>
</dialog>

<script>
(function(){
"use strict";

const EXPRESSIONS=[
 {en:"find out",ko:"알아내다",note:"정보나 사실을 조사해서 알아내기",
  ex:"We need to find out how much paper we use.",
  kr:"우리가 종이를 얼마나 사용하는지 알아내야 해요.",
  pattern:"find out + 알아낼 정보",icon:"search"},
 {en:"set up",ko:"설치하다 · 마련하다",note:"무언가를 사용할 수 있도록 준비하기",
  ex:"Let's set up recycling boxes near the door.",
  kr:"문 근처에 재활용 상자를 설치하자.",
  pattern:"set up + 상자 / 시설 / 조직",icon:"box"},
 {en:"sort out",ko:"분류하다 · 정리하다",note:"이 지문에서는 쓰레기를 종류별로 분류하기",
  ex:"Please sort out the paper and plastic.",
  kr:"종이와 플라스틱을 분류해 주세요.",
  pattern:"sort out + 분류할 대상",icon:"sort"},
 {en:"pay attention to",ko:"~에 주의를 기울이다",note:"안내나 중요한 정보를 집중해서 보기",
  ex:"Pay attention to the recycling signs.",
  kr:"재활용 표지판에 주의를 기울이세요.",
  pattern:"pay attention to + 명사 / 동명사",icon:"sign"},
 {en:"come up with",ko:"~을 생각해 내다",note:"새로운 아이디어나 방법을 떠올리기",
  ex:"Can you come up with a fun recycling game?",
  kr:"재미있는 재활용 게임을 생각해 낼 수 있니?",
  pattern:"come up with + 아이디어 / 해결책",icon:"bulb"},
 {en:"carry out",ko:"실행하다 · 수행하다",note:"이미 세운 계획을 실제로 실행하기",
  ex:"Our class will carry out the plan next week.",
  kr:"우리 반은 다음 주에 그 계획을 실행할 거예요.",
  pattern:"carry out + 계획 / 과제 / 실험",icon:"check"}
];

const READING=[
 ["A group of students wanted to ","find out"," how much waste their school produced each day. "],
 ["They decided to ","set up"," recycling boxes for paper and plastic. "],
 ["They also asked classmates to ","sort out"," their waste carefully. "],
 ["At first, many students did not ","pay attention to"," the recycling signs, so the team "],
 ["","came up with"," a simple points game. "],
 ["With more students joining the project, the team was able to ","carry out"," the plan for an entire month."]
];

const QUESTIONS=[
 ["We do not know how much waste our class makes. We need to _____ the answer.",
  "우리 반이 쓰레기를 얼마나 만드는지 모릅니다. 답을 알아내야 해요.",0,
  "아직 모르는 정보를 알아내므로 find out이에요."],
 ["There are no recycling boxes in the hallway. Let's _____ two boxes there.",
  "복도에 재활용 상자가 없어요. 그곳에 상자 두 개를 설치해요.",1,
  "상자를 사용할 수 있게 설치하므로 set up이에요."],
 ["Paper and plastic are mixed together. Please _____ the waste.",
  "종이와 플라스틱이 섞여 있어요. 쓰레기를 분류해 주세요.",2,
  "섞인 쓰레기를 분류하므로 sort out이에요."],
 ["The signs tell you which box to use. Please _____ them.",
  "표지판이 어떤 상자를 사용할지 알려 줍니다. 표지판에 주의를 기울이세요.",3,
  "안내에 집중해야 하므로 pay attention to예요. to까지 포함하세요."],
 ["Our old recycling game is boring. Can you _____ a new idea?",
  "기존 게임이 지루해요. 새로운 아이디어를 생각해 낼 수 있나요?",4,
  "새 아이디어를 떠올리는 것은 come up with예요."],
 ["We have finished planning. Tomorrow, we will _____ our recycling plan.",
  "계획을 다 세웠어요. 내일 그 계획을 실행할 거예요.",5,
  "정한 계획을 실행하므로 carry out이에요."],
 ["Let's _____ how many plastic bottles we use each day.",
  "우리가 매일 플라스틱병을 몇 개 사용하는지 알아내자.",0,
  "how many로 시작하는 절이 알아낼 정보예요."],
 ["We need to _____ recycling boxes in every classroom.",
  "모든 교실에 재활용 상자를 설치해야 해요.",1,
  "need to 뒤에는 동사원형 set up을 넣어요."],
 ["Students should _____ paper and plastic before putting them in the boxes.",
  "학생들은 종이와 플라스틱을 상자에 넣기 전에 분류해야 해요.",2,
  "종류별로 분류하는 상황이에요. should 뒤에 sort out을 넣어요."],
 ["Please _____ the signs above the boxes.",
  "상자 위의 표지판에 주의를 기울여 주세요.",3,
  "표현 전체는 pay attention to예요."],
 ["Can you _____ a better way to reduce waste?",
  "쓰레기를 줄일 더 나은 방법을 생각해 낼 수 있니?",4,
  "새로운 방법을 생각해 내므로 come up with예요."],
 ["Our team is ready to _____ the plan for a month.",
  "우리 팀은 한 달 동안 그 계획을 실행할 준비가 되어 있어요.",5,
  "계획을 실행하는 것은 carry out이에요."]
];

const MISSIONS=[
 {title:"종이 사용량 조사",desc:"우리 반에서 종이를 얼마나 사용하는지 아직 몰라요. 조사 계획을 세워 주세요.",
  ko:"우리는 우리 반이 종이를 얼마나 사용하는지 알아낼 거예요.",target:0,
  parts:["We will","find out","how much paper","our class uses."],
  distract:["carry out","our class use."],
  explain:"정보를 알아내는 표현은 find out이에요. our class는 단수이므로 uses를 사용해요."},
 {title:"재활용 공간 준비",desc:"복도에 분리배출할 곳이 없어요. 새로운 공간을 만들어 주세요.",
  ko:"우리는 복도에 재활용 상자를 설치할 거예요.",target:1,
  parts:["We will","set up","recycling boxes","in the hallway."],

function icon(name){

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,function(character){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[character];
 });
}
function normalizeAnswer(value){
 return String(value).toLowerCase().trim()
  .replace(/[.!?]+$/,"").replace(/\s+/g," ");
}
function validIndex(value,length){
 return Number.isInteger(value)&&value>=0&&value<length;
}
function shuffle(values){
 const result=values.slice();
 for(let i=result.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  const temporary=result[i];result[i]=result[j];result[j]=temporary;
 }
 return result;
}
function allQuestionIndices(){
 return QUESTIONS.map(function(_,index){return index;});
}
function newMissionState(){
 return {order:[],picked:[],assisted:false,done:false,points:0};
}
function freshState(){
 return {
  tab:"learn",learned:[],read:false,answers:{},drafts:{},
  questionPosition:0,missionIndex:0,queue:allQuestionIndices(),retry:false,
  missions:MISSIONS.map(newMissionState),combo:0,sound:false
 };
}
let state=freshState();

function loadState(){
 try{
  const raw=window.localStorage.getItem(STORAGE_KEY);
  if(!raw)return;
  const saved=JSON.parse(raw);
  if(!saved||typeof saved!=="object")return;

  if(["learn","read","quiz","game","review"].indexOf(saved.tab)!==-1){
   state.tab=saved.tab;
  }
  if(Array.isArray(saved.learned)){
   state.learned=Array.from(new Set(saved.learned.filter(function(n){
    return validIndex(n,6);
   })));
  }
  state.read=saved.read===true;
  state.sound=saved.sound===true;
  state.missionIndex=validIndex(saved.missionIndex,6)?saved.missionIndex:0;
  state.combo=Number.isInteger(saved.combo)?Math.max(0,Math.min(6,saved.combo)):0;

  if(saved.answers&&typeof saved.answers==="object"){
   QUESTIONS.forEach(function(question,index){
    const answer=saved.answers[index];
    if(answer&&typeof answer.value==="string"){
     const value=answer.value.slice(0,300);
     state.answers[index]={
      value:value,
      correct:normalizeAnswer(value)===EXPRESSIONS[question[2]].en
     };
    }
   });
  }
  if(saved.drafts&&typeof saved.drafts==="object"){
   QUESTIONS.forEach(function(_,index){
    if(typeof saved.drafts[index]==="string"){
     state.drafts[index]=saved.drafts[index].slice(0,300);
    }
   });
  }
  if(Array.isArray(saved.queue)){
   const queue=Array.from(new Set(saved.queue.filter(function(n){
    return validIndex(n,QUESTIONS.length);
   })));
   if(queue.length)state.queue=queue;
  }
  state.questionPosition=validIndex(saved.questionPosition,state.queue.length)?
   saved.questionPosition:0;
  state.retry=saved.retry===true;

  if(Array.isArray(saved.missions)){
   MISSIONS.forEach(function(mission,index){
    const source=saved.missions[index];
    if(!source||typeof source!=="object")return;
    const count=mission.parts.length+mission.distract.length;
    const order=Array.isArray(source.order)?source.order:[];
    const orderValid=order.length===count&&new Set(order).size===count&&
     order.every(function(n){return validIndex(n,count);});
    const picked=Array.isArray(source.picked)?
     Array.from(new Set(source.picked.filter(function(n){
      return validIndex(n,count);
     }))):[];
    const done=source.done===true&&picked.length===mission.parts.length&&
     picked.every(function(id,position){return id===position;});
    state.missions[index]={
     order:orderValid?order:[],
     picked:picked,
     assisted:source.assisted===true,
     done:done,
     points:done&&Number.isInteger(source.points)?
      Math.max(0,Math.min(150,source.points)):0
    };
   });
  }
 }catch(error){
  storageAvailable=false;
 }
}
function saveState(){
 if(!storageAvailable)return;
 try{
  window.localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
 }catch(error){
  storageAvailable=false;
  updateStorageNote();
 }
}

function notify(message){
 const element=document.getElementById("toast");

 window.clearTimeout(toastTimeout);

function playSound(correct){
 if(!state.sound)return;
 try{
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass)return;
  const context=new AudioContextClass();
  if(context.state==="suspended"){
   const resumeResult=context.resume();
   if(resumeResult&&typeof resumeResult.catch==="function"){
    resumeResult.catch(function(){});
   }
  }
  const notes=correct?[523,659,784]:[240,190];
  notes.forEach(function(frequency,index){
   const oscillator=context.createOscillator();
   const gain=context.createGain();
   const start=context.currentTime+index*.09;
   oscillator.connect(gain);gain.connect(context.destination);
   oscillator.frequency.value=frequency;
   gain.gain.setValueAtTime(.001,start);
   gain.gain.linearRampToValueAtTime(.06,start+.015);
   gain.gain.exponentialRampToValueAtTime(.001,start+.17);
   oscillator.start(start);oscillator.stop(start+.18);
  });
  window.setTimeout(function(){
   try{
    const closing=context.close();
    if(closing&&typeof closing.catch==="function")closing.catch(function(){});
   }catch(error){}
  },700);
 }catch(error){}
}
function readAloud(text){
 try{
  if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){
   notify("이 환경에서는 음성 읽기를 사용할 수 없어요.");return;
  }
  window.speechSynthesis.cancel();
  const utterance=new window.SpeechSynthesisUtterance(text);
  utterance.lang="en-US";utterance.rate=.85;
  const voices=window.speechSynthesis.getVoices();
  const voice=voices.find(function(item){return item.lang==="en-US";});
  if(voice)utterance.voice=voice;
  utterance.onerror=function(event){
   if(event.error!=="interrupted"&&event.error!=="canceled"){
    notify("음성을 재생하지 못했어요. 문장을 눈으로 읽어 보세요.");
   }
  };
  window.speechSynthesis.speak(utterance);
 }catch(error){
  notify("이 환경에서는 음성 읽기를 사용할 수 없어요.");
 }
}
function celebrate(big){
 playSound(true);
 try{
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const layer=document.getElementById("effects");
  layer.replaceChildren();
  const colors=["#9cc5a1","#f0c3ca","#ead48e","#b6cde6","#c7b7df"];
  for(let i=0;i<(big?75:40);i++){
   const piece=document.createElement("span");
   piece.className="confetti-piece";
   piece.style.background=colors[i%colors.length];
   piece.style.setProperty("--dx",((Math.random()-.5)*Math.min(window.innerWidth,850))+"px");
   piece.style.setProperty("--dy",(100+Math.random()*420)+"px");
   piece.style.setProperty("--spin",((Math.random()-.5)*900)+"deg");
   piece.style.animationDelay=(Math.random()*.18)+"s";
   layer.appendChild(piece);
  }
  window.setTimeout(function(){
   layer.querySelectorAll(".confetti-piece").forEach(function(piece){piece.remove();});
  },2100);
 }catch(error){}
}

  if(!state.answers[index])return;
  if(!isLast){state.questionPosition++;saveState();renderQuiz();}
  else if(state.retry){
   state.retry=false;state.queue=allQuestionIndices();state.questionPosition=0;navigate("review");
  }else navigate("game");
 };
}

function submitQuestion(value){
 const index=state.queue[state.questionPosition];
 if(state.answers[index])return;
 const correct=normalizeAnswer(value)===EXPRESSIONS[QUESTIONS[index][2]].en;
 state.answers[index]={value:value.trim(),correct:correct};
 delete state.drafts[index];
 saveState();renderQuiz();updateHeader();
 if(correct){celebrate(false);notify("정답이에요. 한 걸음 더 성장했어요!");}
 else{
  playSound(false);
  const feedback=mainElement.querySelector(".feedback");
  if(feedback)feedback.classList.add("shake");
 }
}

function currentMissionData(){
 const mission=MISSIONS[state.missionIndex];
 const progress=state.missions[state.missionIndex];
 const tokens=mission.parts.concat(mission.distract);
 if(!progress.order.length){
  progress.order=shuffle(tokens.map(function(_,index){return index;}));saveState();
 }
 return {mission:mission,progress:progress,tokens:tokens};
}
function renderGame(){
 const data=currentMissionData();
 const mission=data.mission,progress=data.progress,tokens=data.tokens;

 mainElement.innerHTML=heading("LITTLE PROJECT BUILDER","영어 조각으로 만드는 초록 프로젝트",
 "상황에 맞는 조각을 순서대로 골라 문장을 만드세요. 필요 없는 조각은 남겨 두세요.")+
 '<div class="game-top"><span class="badge">미션 '+(state.missionIndex+1)+' / 6</span>'+
 '<span class="badge" style="background:var(--pink)">모은 점수 '+totalScore()+'</span>'+
 '<span class="badge" style="background:var(--mint)">연속 성공 '+state.combo+'</span></div>'+
 '<section class="mission"><div class="art">'+icon(EXPRESSIONS[mission.target].icon)+'</div>'+
 '<div><div class="mission-title">'+mission.title+'</div><p>'+mission.desc+'</p>'+
 '<div class="hint">만들 문장: '+mission.ko+'</div></div></section>'+
 (progress.done?
 '<div class="feedback pop" role="status"><strong>미션을 완성했어요!</strong>'+
 '<p>'+mission.parts.join(" ")+'</p><p class="hint">'+mission.explain+'</p>'+
 '<p class="hint">이 미션에서 받은 점수: '+progress.points+'점</p>'+
 '<button id="sentenceAudio">완성 문장 듣기</button></div>':
 '<div class="slot" aria-label="조립 중인 문장">'+
 (progress.picked.length?progress.picked.map(function(id,position){
  return '<button class="token" data-remove="'+position+'" aria-label="'+
   escapeHTML(tokens[id])+' 조각 되돌리기">'+escapeHTML(tokens[id])+'</button>';
 }).join(""):'<span class="placeholder">아래 조각을 순서대로 눌러 주세요.</span>')+
 '</div><p class="hint">선택한 조각을 다시 누르면 되돌릴 수 있어요.</p>'+
 '<div class="pool">'+progress.order.map(function(id){
  return '<button class="token" data-token="'+id+'" '+
   (progress.picked.indexOf(id)!==-1?"disabled":"")+'>'+escapeHTML(tokens[id])+'</button>';
 }).join("")+'</div>'+
 '<div class="actions"><button id="clearPieces">조각 되돌리기</button>'+
 '<button class="soft-yellow" id="missionHint">도움 카드</button>'+
 '<button class="primary" id="buildSentence">문장 완성!</button></div>'+
 (progress.assisted?'<p class="hint">도움을 받으며 연습 중이에요. 완성하면 70점을 받아요.</p>':"")+
 (gameMessage?'<div class="feedback '+(gameMessageIsBad?"bad shake":"")+'" role="status">'+gameMessage+'</div>':""))+
 '<div class="actions"><button id="previousMission" '+(state.missionIndex===0?"disabled":"")+'>← 이전 미션</button>'+
 '<button class="primary" id="nextMission" '+(progress.done?"":"disabled")+'>'+
 (state.missionIndex===5?"내 컬렉션 보기 →":"다음 미션 →")+'</button></div>'+
 '<details><summary>게임 규칙</summary><p class="hint">'+
 '미션은 처음 완성할 때만 점수가 올라가요. 힌트나 틀린 제출 없이 완성하면 100점, '+
 '도움을 받거나 틀린 뒤 완성하면 70점이에요. 첫 시도 성공이 이어지면 최대 50점의 추가 보너스를 받아요. '+
 '힌트를 사용하거나 틀린 답을 제출하면 연속 성공 기록은 초기화돼요. '+
 '활동 화면을 이동해도 조각과 시도 기록은 유지됩니다.</p></details>';

 mainElement.querySelectorAll("[data-token]").forEach(function(button){
  button.onclick=function(){
   const id=Number(button.dataset.token);
   if(progress.done||progress.picked.indexOf(id)!==-1)return;
   progress.picked.push(id);gameMessage="";gameMessageIsBad=false;
   saveState();renderGame();
  };
 });
 mainElement.querySelectorAll("[data-remove]").forEach(function(button){
  button.onclick=function(){
   if(progress.done)return;
   progress.picked.splice(Number(button.dataset.remove),1);
   gameMessage="";gameMessageIsBad=false;saveState();renderGame();
  };
 });
 if(progress.done){
  document.getElementById("sentenceAudio").onclick=function(){readAloud(mission.parts.join(" "));};
 }else{
  document.getElementById("clearPieces").onclick=function(){
   progress.picked=[];gameMessage="";gameMessageIsBad=false;saveState();renderGame();
  };
  document.getElementById("missionHint").onclick=function(){
   progress.assisted=true;state.combo=0;
   gameMessage='<strong>작은 도움 카드</strong><p>핵심 표현은 <b>'+
    EXPRESSIONS[mission.target].en+'</b>예요.</p><p>'+mission.explain+
    '</p><p>첫 조각은 <b>'+mission.parts[0]+'</b>입니다.</p>';
   gameMessageIsBad=false;saveState();renderGame();
  };
  document.getElementById("buildSentence").onclick=checkMission;
 }
 document.getElementById("previousMission").onclick=function(){
  if(state.missionIndex===0)return;
  state.missionIndex--;gameMessage="";gameMessageIsBad=false;saveState();renderGame();
 };
 document.getElementById("nextMission").onclick=function(){
  if(!progress.done)return;
  if(state.missionIndex===5)navigate("review");
  else{
   state.missionIndex++;gameMessage="";gameMessageIsBad=false;saveState();renderGame();
  }
 };
}
function checkMission(){
 const data=currentMissionData();
 const mission=data.mission,progress=data.progress,tokens=data.tokens;
 if(progress.done)return;
 if(!progress.picked.length){notify("조각을 먼저 골라 주세요.");return;}
 const correct=progress.picked.length===mission.parts.length&&
  progress.picked.every(function(id,index){return id===index;});
 if(correct){
  state.combo=progress.assisted?0:state.combo+1;
  const bonus=progress.assisted?0:Math.min(50,(state.combo-1)*10);
  progress.points=(progress.assisted?70:100)+bonus;
  progress.done=true;gameMessage="";gameMessageIsBad=false;
  saveState();updateHeader();renderGame();celebrate(true);
  notify("미션 완성! +"+progress.points+"점"+(bonus?" · 연속 성공 보너스 포함":""));
 }else{
  progress.assisted=true;state.combo=0;
  const texts=progress.picked.map(function(id){return tokens[id];});
  const wrongExpression=texts.some(function(text){
   return EXPRESSIONS.some(function(item){
    return item.en===text&&item.en!==EXPRESSIONS[mission.target].en;
   });
  });
  let hint="";
  if(wrongExpression){
   hint="지금은 ‘"+EXPRESSIONS[mission.target].ko+"’라는 뜻이 필요해요. 표현을 다시 골라 보세요.";
  }else if(progress.picked.length!==mission.parts.length){
   hint="필요한 조각은 "+mission.parts.length+"개예요. 빠진 내용이나 필요 없는 조각을 확인해 보세요.";
  }else{
   hint="조각의 순서와 문법을 확인해 보세요. 특히 표현 뒤의 대상과 장소·기간 표현을 살펴보세요.";
  }
  gameMessage='<strong>조금만 다듬으면 돼요.</strong><p>'+hint+
   '</p><p class="hint">선택한 조각을 눌러 되돌리거나 도움 카드를 열어 보세요.</p>';
  gameMessageIsBad=true;saveState();playSound(false);renderGame();
 }
}

function renderReview(){
 const answeredCount=Object.keys(state.answers).length;
 const correctCount=Object.keys(state.answers).filter(function(key){
  return state.answers[key].correct;
 }).length;
 const missionCount=state.missions.filter(function(mission){return mission.done;}).length;
 const wrong=QUESTIONS.map(function(question,index){return {question:question,index:index};})
  .filter(function(item){return state.answers[item.index]&&!state.answers[item.index].correct;});

 mainElement.innerHTML=heading("MY LITTLE COLLECTION","작은 노력들이 모였어요.",
 "완성한 문장과 표현을 돌아보고, 헷갈렸던 문제에 다시 도전해 보세요.")+
 '<div class="reward"><div class="reward-icon">'+icon("trophy")+'</div><div><strong>'+
 (missionCount===6?"재활용 프로젝트 완성!":"프로젝트가 자라고 있어요.")+'</strong>'+
 '<div>미션 '+missionCount+' / 6 · 모은 점수 <b>'+totalScore()+'</b></div></div></div>'+
 '<div class="grid">'+
 '<div class="card"><div class="eyebrow">WORD CARDS</div><div class="metric">'+state.learned.length+' / 6</div>수집한 표현</div>'+
 '<div class="card"><div class="eyebrow">CHALLENGE</div><div class="metric">'+correctCount+' / 12</div>현재 정답 · '+answeredCount+'문항 응답</div>'+
 '<div class="card"><div class="eyebrow">PROJECT</div><div class="metric">'+missionCount+' / 6</div>완성한 미션</div></div>'+
 '<h3>내가 완성한 문장</h3>'+
 MISSIONS.map(function(mission,index){
  const done=state.missions[index].done;
  return '<div class="review-row"><strong>'+(index+1)+'. '+mission.title+'</strong>'+
   '<div class="saved-sentence">'+(done?mission.parts.join(" "):"아직 완성하지 않은 미션이에요.")+'</div>'+
   '<p class="hint">'+(done?mission.ko:"미션 게임에서 문장을 조립해 보세요.")+'</p></div>';
 }).join("")+
 '<h3>여섯 가지 표현</h3><div class="bank">'+EXPRESSIONS.map(function(item){
  return '<span><b>'+item.en+'</b> · '+item.ko+'</span>';
 }).join("")+'</div>'+
 '<h3>오답 함께 살펴보기</h3>'+
 (wrong.length?wrong.map(function(item){
  const question=item.question;
  return '<div class="review-row"><p>'+
   question[0].replace("_____","<strong>"+EXPRESSIONS[question[2]].en+"</strong>")+
   '</p><p class="hint">내 답: '+escapeHTML(state.answers[item.index].value)+
   '<br>'+question[3]+'</p></div>';
 }).join(""):'<p class="muted">'+
 (answeredCount===12?"현재 오답이 없어요. 여섯 표현을 잘 구분했어요!":"응답한 문항 중 현재 오답이 없어요.")+'</p>')+
 '<div class="actions"><div class="button-row">'+
 (wrong.length?'<button class="soft-yellow" id="retryQuestions">오답 다시 도전</button>':"")+
 (answeredCount<12?'<button id="continueQuestions">챌린지 이어 하기</button>':"")+
 '<button class="primary" id="continueMissions">'+
 (missionCount===6?"미션 문장 다시 보기":"미션 이어 하기")+'</button>'+
 '</div><button id="requestReset">기록 초기화</button></div>';

 const retryButton=document.getElementById("retryQuestions");
 if(retryButton)retryButton.onclick=function(){
  state.queue=wrong.map(function(item){return item.index;});
  state.questionPosition=0;state.retry=true;
  wrong.forEach(function(item){
   delete state.answers[item.index];delete state.drafts[item.index];
  });
  navigate("quiz");
 };
 const continueButton=document.getElementById("continueQuestions");
 if(continueButton)continueButton.onclick=function(){
  state.queue=allQuestionIndices();state.retry=false;
  state.questionPosition=QUESTIONS.findIndex(function(_,index){return !state.answers[index];});
  navigate("quiz");
 };
 document.getElementById("continueMissions").onclick=function(){
  const next=state.missions.findIndex(function(mission){return !mission.done;});
  state.missionIndex=next<0?0:next;navigate("game");
 };
 document.getElementById("requestReset").onclick=openResetDialog;
}
function openResetDialog(){
 const dialog=document.getElementById("resetDialog");
 try{
  if(typeof dialog.showModal==="function"){dialog.showModal();return;}
 }catch(error){}
 dialog.setAttribute("open","");
 dialog.style.position="fixed";
 dialog.style.inset="20% auto auto 50%";
 dialog.style.transform="translateX(-50%)";
 dialog.style.zIndex="120";
}
function closeResetDialog(){
 const dialog=document.getElementById("resetDialog");
 try{
  if(typeof dialog.close==="function")dialog.close();
 }catch(error){}
 dialog.removeAttribute("open");
}
function render(){
 updateHeader();
 if(state.tab==="read")renderRead();
 else if(state.tab==="quiz")renderQuiz();
 else if(state.tab==="game")renderGame();
 else if(state.tab==="review")renderReview();
 else renderLearn();
}

document.querySelectorAll("[data-tab]").forEach(function(button){
 button.onclick=function(){navigate(button.dataset.tab);};
});
document.getElementById("soundButton").onclick=function(){
 state.sound=!state.sound;saveState();updateHeader();if(state.sound)playSound(true);
};
document.getElementById("cancelReset").onclick=closeResetDialog;
document.getElementById("confirmReset").onclick=function(){
 closeResetDialog();
 state=freshState();gameMessage="";gameMessageIsBad=false;
 try{if(window.speechSynthesis)window.speechSynthesis.cancel();}catch(error){}
 saveState();render();notify("새로운 프로젝트를 시작해 보세요.");
};

loadState();
render();

})();
</script>
</body>
</html>
